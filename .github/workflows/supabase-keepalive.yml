name: Supabase Keep-Alive

# Supabase's free tier pauses a project after ~7 days with no API activity.
# This makes a trivial, harmless read every 3 days so the lavish-wig project
# always looks "in use" and never auto-pauses. Nothing is written or changed.
on:
  schedule:
    - cron: "23 7 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the orders table
        run: |
          curl -sf "https://mlxaeuubgladpumsixfz.supabase.co/rest/v1/settings?select=key&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "Supabase responded: %{http_code}\n"
        env:
          # This is the site's public anon key (RLS, not secrecy, protects the
          # data) — it already ships in the deployed site's JavaScript bundle,
          # so keeping it here in plain text carries no additional risk.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1seGFldXViZ2xhZHB1bXNpeGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Nzc1ODUsImV4cCI6MjEwMTA1MzU4NX0.UxqjfuFUMFkvHK8fXBC-9k-ZhrLUBpPbJE1isymqHEE
